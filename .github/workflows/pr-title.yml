# PRs are squash-merged and the title becomes the commit on main
# (docs/decisions/0001), so the title has to follow Conventional Commits.
# The `pr-title` job is a required check in .github/rulesets/main.json.
name: PR title

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The types AGENTS.md lists; `release` is the version-bump PR
          # (docs/releasing.md).
          types: |
            feat
            fix
            docs
            test
            ci
            refactor
            perf
            build
            chore
            deps
            revert
            release

  # Labels the PR from its title, so .github/release.yml can sort the
  # release notes: `feat` adds enhancement, `fix` adds bug, and a `!`
  # (`feat!: …`) adds breaking. The labels follow the title when it's
  # edited. Not a required check. A fork's PR gets a read-only token, and
  # Dependabot's PRs are left out of the notes, so both are skipped.
  label:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # issues: write creates the breaking label the first time.
      issues: write
      pull-requests: write
    steps:
      - name: Label from the title
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^([a-z]+)(\([^)]*\))?(!)?: '
          want=" "
          if [[ "$TITLE" =~ $pattern ]]; then
            case "${BASH_REMATCH[1]}" in
              feat) want+="enhancement " ;;
              fix) want+="bug " ;;
            esac
            [[ -z "${BASH_REMATCH[3]}" ]] || want+="breaking "
          fi
          have=" $(gh pr view "$PR" --json labels --jq '.labels[].name' | tr '\n' ' ')"
          for label in enhancement bug breaking; do
            if [[ "$want" == *" $label "* && "$have" != *" $label "* ]]; then
              if [[ "$label" == breaking ]]; then
                gh label create breaking --color B60205 \
                  --description "Users have to change something" --force
              fi
              gh pr edit "$PR" --add-label "$label"
            elif [[ "$want" != *" $label "* && "$have" == *" $label "* ]]; then
              gh pr edit "$PR" --remove-label "$label"
            fi
          done
