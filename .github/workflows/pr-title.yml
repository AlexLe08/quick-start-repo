# PRs are squash-merged and the title becomes the commit on main
# (docs/decisions/0001), so the title has to follow Conventional Commits.
# A required check in .github/rulesets/main.json.
name: PR title

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The types AGENTS.md lists; `release` is the version-bump PR
          # (docs/releasing.md).
          types: |
            feat
            fix
            docs
            test
            ci
            refactor
            perf
            build
            chore
            deps
            revert
            release
