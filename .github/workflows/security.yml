# Checks that don't depend on the language: secrets committed by mistake,
# and mistakes in these workflows themselves.
name: Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Scans the PR's commits (on main: the pushed commits) for keys and
  # tokens. Free for repositories on a personal account; one moved to an
  # organization needs a free GITLEAKS_LICENSE secret (gitleaks.io).
  # A required check in .github/rulesets/main.json.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The token is read-only, so it can't comment on the PR; the
          # failed check and its log say what was found.
          GITLEAKS_ENABLE_COMMENTS: "false"

  # Audits .github/workflows/ for template injection, over-broad
  # permissions, unpinned actions and the like. Results go to the log
  # (advanced-security off), which works on private repositories too.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          advanced-security: false
