[project]
name = "{{PROJECT_NAME}}"
version = "0.1.0"
description = "{{PROJECT_DESCRIPTION}}"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
{{PROJECT_NAME}} = "{{PACKAGE_NAME}}.__main__:main"

[dependency-groups]
dev = ["pytest>=9.2", "pytest-cov>=7", "ruff>=0.17.6"]

[build-system]
requires = ["uv_build>=0.13.10,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--cov={{PACKAGE_NAME}}", "--cov-report=term-missing", "--cov-fail-under=80"]

[tool.coverage.run]
# The entry point only wires things together; test what it calls.
omit = ["*/__main__.py"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
