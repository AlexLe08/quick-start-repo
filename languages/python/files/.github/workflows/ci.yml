name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # A required check in .github/rulesets/main.json: renaming this job
  # means updating the ruleset. scripts/check.sh runs the same steps.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs uv; uv reads .python-version and fetches that Python.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          enable-cache: true

      - name: Install (locked)
        run: uv sync --locked

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Format
        run: uv run --no-sync ruff format --check .

      - name: Type-check
        run: uv run --no-sync {{TYPECHECK}}

      # Fails below --cov-fail-under in pyproject.toml.
      - name: Tests and coverage
        run: uv run --no-sync pytest -q

      # Known vulnerabilities in the locked dependencies.
      - name: Audit dependencies
        run: |
          uv export --locked --all-groups --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" --require-hashes --disable-pip
